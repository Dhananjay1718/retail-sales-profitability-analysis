name: Build project
on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'sql/*.sql'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
      - '**/README.md'
      - 'docs/**'
      - 'powerbi/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retail-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate project
        run: python python/build_project.py
      - name: Publish generated project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports excel dashboard sql/retail.db python/analysis.ipynb dist
          if ! git diff --cached --quiet; then
            git commit -m "Build validated retail analytics deliverables"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: retail-analytics
          path: dist/retail-analytics.zip
          retention-days: 30
